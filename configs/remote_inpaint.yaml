# Remote test config with InpaintNet trajectory gap-filling enabled.
# Keeps action (player / pose / stroke) on for the same A/B baseline.
# Weights staged at /root/personal/, not repo weights/.
ball:
  weights: weights/wasb_tennis_best.pth.tar
bounce:
  weights: weights/bounce_catboost.cbm
inpainter:
  enabled: true
  weights: weights/InpaintNet_best.pt
  device: cpu
  window_mode: single        # single-pass (fully-conv model, no seam artifacts)
  max_gap_frames: 60         # skip gaps longer than this
  th_h_frac: 0.05            # out-of-view threshold as fraction of frame height
action:
  enabled: true
  pose_weights: /root/personal/yolo26n-pose.pt
  pose_device:  cuda            # cpu | cuda
  rnn_weights:  /root/personal/tennis_rnn.h5
  player: {}
